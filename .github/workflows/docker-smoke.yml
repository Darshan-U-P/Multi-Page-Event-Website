name: Docker smoke test

on:
  push:
    branches:
      - feat/gsap-admin-live-editor-v2
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create temporary local admin credentials
        shell: bash
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          password = secrets.token_urlsafe(32)
          session_secret = secrets.token_urlsafe(48)
          Path(".env").write_text(
              "ADMIN_USERNAME=admin\n"
              f"ADMIN_PASSWORD={password}\n"
              f"SESSION_SECRET={session_secret}\n",
              encoding="utf-8",
          )
          PY

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for API and check public routes
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "EventSphere"
          curl --fail --silent http://127.0.0.1:8080/admin/ | grep -q "Admin sign in"
          if curl --fail --silent http://127.0.0.1:8080/.env >/dev/null; then
            echo "ERROR: .env is reachable from Apache."
            exit 1
          fi
          if curl --fail --silent http://127.0.0.1:8080/backend/app/main.py >/dev/null; then
            echo "ERROR: backend source is reachable from Apache."
            exit 1
          fi

      - name: Exercise admin authentication and content APIs
        shell: bash
        run: |
          python - <<'PY'
          import http.cookiejar
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          env = dict(line.split("=", 1) for line in Path(".env").read_text().splitlines() if line and not line.startswith("#"))
          base = "http://127.0.0.1:8080"
          jar = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def call(path, method="GET", payload=None, csrf=None):
              headers = {"Accept": "application/json", "Origin": base}
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode()
              if csrf:
                  headers["X-CSRF-Token"] = csrf
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with client.open(req, timeout=10) as response:
                      raw = response.read().decode()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read().decode()
                  try:
                      body = json.loads(raw)
                  except json.JSONDecodeError:
                      body = {"detail": raw}
                  return error.code, body

          status, login = call("/api/auth/login", "POST", {
              "username": env["ADMIN_USERNAME"],
              "password": env["ADMIN_PASSWORD"]
          })
          assert status == 200, (status, login)
          csrf = login["csrf_token"]

          draft = {
              "title": "CI Smoke Test Event",
              "category": "Testing",
              "date": "2027-01-15",
              "location": "CI Runner",
              "description": "Temporary event created by the automated integration test.",
              "status": "draft"
          }
          status, created = call("/api/events", "POST", draft, csrf)
          assert status == 200, (status, created)
          event_id = created["id"]

          status, listing = call("/api/events")
          assert status == 200
          assert all(event["id"] != event_id for event in listing["events"]), "Draft event leaked into public listing."

          draft["status"] = "published"
          status, updated = call("/api/events/" + event_id, "PUT", draft, csrf)
          assert status == 200, (status, updated)
          status, listing = call("/api/events")
          assert status == 200 and any(event["id"] == event_id for event in listing["events"]), "Published event missing from public API."

          status, page = call("/api/content/pages", "GET")
          assert status == 200 and "content" in page
          new_heading = "EventSphere CI Content Check"
          status, saved = call("/api/content/pages", "PUT", {"content": {"hero_title": new_heading}}, csrf)
          assert status == 200, (status, saved)
          status, page = call("/api/content/pages")
          assert page["content"]["hero_title"] == new_heading

          settings = {"animations_enabled": False, "motion_intensity": "subtle", "accent_color": "#123456"}
          status, changed = call("/api/content/settings", "PUT", {"settings": settings}, csrf)
          assert status == 200 and changed["settings"]["accent_color"] == "#123456", (status, changed)
          status, changed = call("/api/content/settings")
          assert changed["settings"]["animations_enabled"] is False

          status, deleted = call("/api/events/" + event_id, "DELETE", csrf=csrf)
          assert status == 200, (status, deleted)
          status, logout = call("/api/auth/logout", "POST", {}, csrf)
          assert status == 200, (status, logout)
          print("Admin API smoke tests passed: login, CSRF, event draft/publish/delete, page copy, settings, logout.")
          PY

      - name: Stop services and remove temporary database
        if: always()
        run: docker compose down -v
